# 작성자 백승준
spring:
  application:
    name: monito

  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
    show-sql: true

  flyway:
    enabled: false

logging:
  level:
    com:
      monito: debug

server:
  port: 8080