spring:
  application:
    name: monito

  profiles:
    active: dev

  datasource:
    driver-class-name: oracle.jdbc.driver.OracleDriver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      maximum-pool-size: 100         # 배치 INSERT(40) + 조회(30) + 여유분(30)
      minimum-idle: 20               # 최소 유지 커넥션
      connection-timeout: 30000      # 커넥션 대기 시간 30초
      idle-timeout: 600000           # 유휴 커넥션 타임아웃 10분
      max-lifetime: 1800000          # 커넥션 최대 수명 30분
      leak-detection-threshold: 60000 # 커넥션 누수 감지 1분

  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 100              # Batch INSERT 크기
        order_inserts: true            # INSERT 순서 정렬 (배치 최적화)
        order_updates: true            # UPDATE 순서 정렬
        batch_versioned_data: true     # 버전 데이터도 배치 처리

  flyway:
    enabled: true
    locations: classpath:db/migration
    sql-migration-suffixes: .sql

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:mySecretKey123456789012345678901234567890}  # ?? 32? ??
    expiration: 86400000  # 24?? (???)
    refresh-expiration: 604800000  # 7? (???)

  scheduler:
    metrics-partition-cleanup:
      retention-days: 30  # 로그 보관 기간 (일)
      cron: "0 0 2 * * *"  # 실행 시간 (매일 새벽 2시)
    oom-partition-cleanup:
      retention-days: 180
      cron: "0 0 3 * * *"
    container-summary-push:
      fixedDelay: 1000
      initialDelay: 1000